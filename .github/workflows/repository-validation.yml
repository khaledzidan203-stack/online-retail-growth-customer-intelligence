name: Repository Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Retail analytics evidence quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository evidence contract
        run: python scripts/validate_repository.py

      - name: Run committed artifact regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile Python source
        run: python -m compileall -q src scripts tests
